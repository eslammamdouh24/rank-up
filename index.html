<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RANK UP</title>
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RANK UP">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ---------- tokens ---------- */
:root {
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#eceef4; --surface-3:#e2e5ee; --border:rgba(15,20,35,.07);
  --text:#0e1116; --muted:#687085; --faint:#9aa1b2;
  --a1:#7c5cff; --a2:#3fa9ff; --grad:linear-gradient(135deg,#7c5cff 0%,#3fa9ff 100%);
  --gold:#f5a524; --gold-2:#ffd24d; --gold-grad:linear-gradient(90deg,#f5a524,#ffd24d);
  --ok:#16b364; --ok-soft:rgba(22,179,100,.12); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.13); --bad:#f04452; --bad-soft:rgba(240,68,82,.11);
  --info-soft:rgba(63,169,255,.12); --shadow:0 10px 30px rgba(20,25,45,.08); --glass:rgba(255,255,255,.82);
}
:root[data-theme="dark"] {
  --bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f2a; --surface-3:#242a37; --border:rgba(255,255,255,.06);
  --text:#f2f4f8; --muted:#8a93a6; --faint:#5d6578;
  --ok:#2ed47a; --ok-soft:rgba(46,212,122,.13); --warn:#ffb020; --warn-soft:rgba(255,176,32,.12); --bad:#ff5a6a; --bad-soft:rgba(255,90,106,.12);
  --info-soft:rgba(63,169,255,.12); --shadow:0 10px 30px rgba(0,0,0,.35); --glass:rgba(20,23,31,.78);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f2a; --surface-3:#242a37; --border:rgba(255,255,255,.06);
    --text:#f2f4f8; --muted:#8a93a6; --faint:#5d6578;
    --ok:#2ed47a; --ok-soft:rgba(46,212,122,.13); --warn:#ffb020; --warn-soft:rgba(255,176,32,.12); --bad:#ff5a6a; --bad-soft:rgba(255,90,106,.12);
    --info-soft:rgba(63,169,255,.12); --shadow:0 10px 30px rgba(0,0,0,.35); --glass:rgba(20,23,31,.78);
  }
}

/* ---------- base ---------- */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--text); }
body { font-family:-apple-system, "SF Pro Display", "SF Arabic", system-ui, "Segoe UI", Tahoma, sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
#app { max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 110px); }
body.focus #app { padding-bottom:calc(env(safe-area-inset-bottom) + 28px); }
body.focus nav { display:none; }
button { font:inherit; color:inherit; cursor:pointer; }
svg.i { width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
.en { font-weight:700; unicode-bidi:isolate; direction:ltr; }
.nr, .ltr { unicode-bidi:isolate; white-space:nowrap; direction:ltr; }
.muted { color:var(--muted); } .center { text-align:center; }
.small { font-size:14px; color:var(--muted); }
h1 { font-size:30px; font-weight:800; letter-spacing:-.4px; margin:0; line-height:1.2; }
h2 { font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.3px; margin:26px 4px 10px; }
h3 { font-size:16px; margin:0 0 6px; }
.eyebrow { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.eyebrow .d { color:var(--muted); font-size:15px; font-weight:600; }
.chip { display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); color:var(--text); font-size:13px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap; }
.chip.glass { background:rgba(255,255,255,.14); color:#fff; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.chip.gold { background:rgba(245,165,36,.16); color:var(--gold); }
.chip svg.i { width:15px; height:15px; }

/* ---------- surfaces ---------- */
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:16px; margin:12px 0; box-shadow:var(--shadow); }
.card.flat { box-shadow:none; background:var(--surface-2); border:0; }
.note { display:flex; gap:11px; align-items:center; border-radius:18px; padding:13px 14px; margin:12px 0; font-size:15px; font-weight:600; }
.brand { font-size:22px; font-weight:900; letter-spacing:2px; direction:ltr; text-align:right; line-height:1.1; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-style:italic; }
.note .ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; }
.note.warn { background:var(--warn-soft); } .note.warn .ic { background:var(--warn); color:#fff; }
.note.info { background:var(--info-soft); } .note.info .ic { background:var(--a2); color:#fff; }
.note.ok { background:var(--ok-soft); } .note.ok .ic { background:var(--ok); color:#fff; }
.note .go { margin-inline-start:auto; background:none; border:0; color:var(--a2); font-weight:800; padding:4px; }

/* ---------- buttons ---------- */
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:58px; border:0; border-radius:18px; background:var(--grad); color:#fff; font-weight:800; font-size:18px; margin:12px 0; box-shadow:0 10px 24px rgba(124,92,255,.35); transition:transform .12s; }
.btn:active { transform:scale(.97); }
.btn.ok { background:linear-gradient(135deg,#16b364,#2ed47a); box-shadow:0 10px 24px rgba(46,212,122,.3); }
.btn.gold { background:var(--gold-grad); color:#241a00; box-shadow:0 10px 24px rgba(245,165,36,.3); }
.btn.ghost { background:var(--surface-2); color:var(--text); box-shadow:none; font-size:16px; height:52px; font-weight:700; }
.btn.white { background:#fff; color:#0e1116; box-shadow:0 10px 24px rgba(0,0,0,.25); }
.btn svg.i { width:20px; height:20px; }
.btn.play svg.i { fill:currentColor; stroke:none; }
.tlink { background:none; border:0; color:var(--a2); font-weight:700; font-size:15px; padding:8px 0; display:inline-flex; align-items:center; gap:4px; }
.back { display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:0; border-radius:999px; padding:7px 13px 7px 15px; font-weight:700; font-size:14.5px; margin-bottom:14px; }
.back svg.i { width:18px; height:18px; }

/* ---------- player ---------- */
.player { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:14px; box-shadow:var(--shadow); }
.rank { width:56px; height:56px; flex:none; border-radius:18px; display:grid; place-items:center; color:#fff; font-weight:900; font-size:30px; font-family:-apple-system, system-ui, sans-serif;
  background:linear-gradient(145deg,var(--c1),var(--c2)); box-shadow:0 8px 20px -6px var(--c1), inset 0 1px 0 rgba(255,255,255,.35); text-shadow:0 2px 6px rgba(0,0,0,.25); }
.rank.big { width:104px; height:104px; border-radius:32px; font-size:60px; margin:0 auto; }
.rank.sm { width:42px; height:42px; border-radius:14px; font-size:22px; }
.pinfo { flex:1; min-width:0; }
.lvl { display:flex; align-items:center; gap:8px; }
.lvl b { font-size:19px; font-weight:800; }
.lvl .rn { color:var(--muted); font-size:14px; font-weight:600; }
.lvl .streak { margin-inline-start:auto; display:inline-flex; align-items:center; gap:3px; color:#ff7a2f; font-weight:800; font-size:15px; }
.lvl .streak svg.i { width:18px; height:18px; fill:#ff7a2f; stroke:#ff7a2f; }
.xpbar { height:8px; background:var(--surface-3); border-radius:99px; overflow:hidden; margin:8px 0 5px; }
.xpbar i { display:block; height:100%; background:var(--gold-grad); border-radius:99px; transition:width .6s cubic-bezier(.2,.8,.2,1); }
.xpt { font-size:12.5px; color:var(--muted); font-weight:600; }

/* ---------- quest hero ---------- */
.quest { position:relative; overflow:hidden; border-radius:28px; margin:14px 0 6px; color:#fff; min-height:250px; padding:18px; display:flex; flex-direction:column; justify-content:flex-end; background:#111 var(--bg-img) center/cover no-repeat; box-shadow:0 18px 40px -12px rgba(20,10,60,.55); }
.quest::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(11,13,18,.05) 0%,rgba(11,13,18,.55) 45%,rgba(11,13,18,.94) 100%); }
.quest::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(63,169,255,0) 55%); mix-blend-mode:screen; }
.quest > * { position:relative; z-index:1; }
.quest .lab { align-self:flex-start; margin-bottom:auto; z-index:2; }
.quest .t { margin-top:14px; }
.quest .t { font-size:34px; font-weight:900; letter-spacing:-.6px; line-height:1.1; }
.quest .t.en2 { direction:ltr; text-align:right; }
.quest .meta { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px; }
.quest .bar { height:6px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden; margin:14px 0 0; }
.quest .bar i { display:block; height:100%; background:var(--gold-grad); border-radius:99px; }
.quest .btn { margin-bottom:0; }

/* ---------- timeline ---------- */
.tl { list-style:none; margin:0; padding:0; }
.tl li { display:flex; align-items:center; gap:12px; padding:9px; margin:8px 0; background:var(--surface); border:1px solid var(--border); border-radius:20px; }
.tl .th { width:56px; height:56px; border-radius:15px; object-fit:cover; flex:none; background:var(--surface-2); display:grid; place-items:center; color:var(--a1); }
.tl .nm { flex:1; min-width:0; font-weight:700; font-size:16px; }
.tl .nm small { display:block; font-weight:500; font-size:13.5px; color:var(--muted); margin-top:1px; }
.tl .st { width:28px; height:28px; border-radius:50%; border:2px solid var(--surface-3); flex:none; display:grid; place-items:center; }
.tl li.done .st { background:var(--ok); border-color:var(--ok); color:#fff; }
.tl li.done .st svg.i { width:16px; height:16px; stroke-width:3; }
.tl li.done .nm { color:var(--muted); }
.tl li.done .th { opacity:.55; }
.tl li.next { border-color:rgba(124,92,255,.55); box-shadow:0 0 0 3px rgba(124,92,255,.12); }

/* ---------- focus flow ---------- */
.ftop { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.ftop .x { width:40px; height:40px; border-radius:50%; border:0; background:var(--surface-2); display:grid; place-items:center; flex:none; }
.segs { flex:1; display:flex; gap:4px; direction:rtl; }
.segs i { flex:1; height:5px; border-radius:99px; background:var(--surface-3); }
.segs i.on { background:var(--grad); }
.segs i.cur { background:var(--gold-grad); }
.media { position:relative; border-radius:26px; overflow:hidden; aspect-ratio:4/3.2; background:var(--surface-2); }
.media img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .45s; }
.media img.b { opacity:0; } .media.flip img.b { opacity:1; }
.media::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(8,10,14,.92)); }
.media .cap { position:absolute; top:12px; right:12px; z-index:2; }
.media .ttl { position:absolute; bottom:14px; right:16px; left:16px; z-index:2; color:#fff; }
.media .ttl .n { font-size:28px; font-weight:900; direction:ltr; text-align:right; letter-spacing:-.4px; line-height:1.15; }
.media .ttl .s { opacity:.8; font-size:14px; }
.hint { display:flex; align-items:center; gap:8px; border-radius:16px; padding:11px 13px; margin:12px 0 0; font-weight:600; font-size:14.5px; background:var(--surface-2); }
.hint svg.i { width:19px; height:19px; flex:none; }
.hint.up { background:var(--ok-soft); color:var(--ok); }
.hint.y { background:var(--warn-soft); }
.setcard { background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:16px; margin:12px 0; box-shadow:var(--shadow); }
.sethead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.sethead b { font-size:18px; }
.dots { display:flex; gap:6px; }
.dots i { width:10px; height:10px; border-radius:50%; background:var(--surface-3); }
.dots i.on { background:var(--ok); } .dots i.cur { background:var(--a1); box-shadow:0 0 0 4px rgba(124,92,255,.2); }
.pickers { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pickers.one { grid-template-columns:1fr; }
.picker { background:var(--surface-2); border-radius:20px; padding:12px 8px 10px; text-align:center; }
.picker .l { font-size:12.5px; color:var(--muted); font-weight:700; }
.picker input { width:100%; text-align:center; font:inherit; font-size:38px; font-weight:800; border:0; background:transparent; color:var(--text); direction:ltr; padding:0; letter-spacing:-1px; }
.picker input:focus { outline:none; color:var(--a1); }
.picker .pm { display:flex; gap:8px; justify-content:center; direction:ltr; margin-top:4px; }
.picker .pm button { width:46px; height:40px; border-radius:13px; border:0; background:var(--surface); box-shadow:0 1px 0 var(--border); display:grid; place-items:center; }
.picker .pm svg.i { width:20px; height:20px; stroke-width:2.6; }
.logged { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.logged span { background:var(--ok-soft); color:var(--ok); border-radius:999px; padding:4px 11px; font-size:13.5px; font-weight:800; direction:ltr; }
.ring { position:relative; width:210px; height:210px; margin:6px auto 4px; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring .bgc { stroke:var(--surface-3); } .ring .fg { stroke:url(#rg); transition:stroke-dashoffset .5s linear; }
.ring .mid { position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring .tm { font-size:50px; font-weight:800; direction:ltr; letter-spacing:-1.5px; line-height:1; }
.ring .lb { font-size:13px; color:var(--muted); font-weight:700; margin-top:6px; }
.howbtn { display:flex; align-items:center; gap:10px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px; font-weight:700; }
.howbtn .chev { margin-inline-start:auto; color:var(--muted); transition:transform .2s; }
.how.open .howbtn .chev { transform:rotate(-90deg); }
.how .body { display:none; padding:8px 6px 2px; }
.how.open .body { display:block; }
.how ol, .how ul { margin:4px 0 10px; padding-right:22px; }
.how li { margin:3px 0; }
.how .bad h3 { color:var(--bad); }
.callout { display:flex; gap:8px; background:var(--info-soft); border-radius:14px; padding:10px 12px; margin:8px 0; font-size:14.5px; }
.choice { display:flex; align-items:center; gap:14px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:16px; margin:10px 0; text-align:right; box-shadow:var(--shadow); }
.choice .dot { width:46px; height:46px; border-radius:15px; flex:none; display:grid; place-items:center; font-weight:900; color:#fff; font-size:13px; direction:ltr; }
.choice b { display:block; font-size:18px; }
.choice small { color:var(--muted); font-size:14px; }
.photo { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:20px; display:block; background:var(--surface-2); }
.item { background:var(--surface); border:1px solid var(--border); border-radius:22px; overflow:hidden; margin:12px 0; }
.item .tx { padding:12px 14px; }
.item .tx b { font-size:16.5px; }
.list-plain { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:4px 14px; margin:12px 0; }
.list-plain .r { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
.list-plain .r:last-child { border-bottom:0; }
.list-plain .r .k { flex:1; color:var(--muted); font-size:15px; }
.list-plain .r .v { font-weight:700; text-align:left; max-width:62%; }
.list-plain .r .v.wrap { text-align:right; }
.num-badge { width:28px; height:28px; border-radius:9px; background:var(--surface-2); display:grid; place-items:center; font-weight:800; font-size:14px; color:var(--a1); flex:none; }
.burst { width:110px; height:110px; border-radius:36px; margin:12px auto 10px; display:grid; place-items:center; background:var(--grad); color:#fff; box-shadow:0 20px 40px -10px rgba(124,92,255,.6); }
.burst svg.i { width:56px; height:56px; stroke-width:2.6; }
.bigxp { font-size:34px; font-weight:900; text-align:center; background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent; direction:ltr; }

/* ---------- stats & forms ---------- */
.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 6px; text-align:center; }
.tile b { display:block; font-size:22px; font-weight:800; direction:ltr; letter-spacing:-.5px; }
.tile span { font-size:12px; color:var(--muted); font-weight:600; }
.tile b.pos { color:var(--bad); } .tile b.neg { color:var(--ok); }
.winput { display:flex; align-items:center; gap:10px; }
.winput input { flex:1; min-width:0; height:64px; font:inherit; font-size:34px; font-weight:800; text-align:center; border:0; border-radius:18px; background:var(--surface-2); color:var(--text); direction:ltr; }
.winput input:focus { outline:2px solid var(--a1); }
.winput .btn { width:auto; padding:0 24px; height:64px; margin:0; }
.chart { margin-top:14px; direction:ltr; }
.chart svg { width:100%; height:110px; display:block; overflow:visible; }
.field { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.field:last-child { border-bottom:0; }
.field label { flex:1; font-weight:600; font-size:15.5px; }
.field input { width:110px; height:46px; font:inherit; font-size:19px; font-weight:700; text-align:center; border:0; border-radius:13px; background:var(--surface-2); color:var(--text); direction:ltr; }
.field input:focus { outline:2px solid var(--a1); }
.field.col { flex-direction:column; align-items:stretch; gap:6px; }
.field input.wide { width:100%; direction:rtl; text-align:right; font-size:16px; font-weight:500; padding:0 12px; }
.seg { display:flex; background:var(--surface-2); border-radius:16px; padding:4px; gap:4px; margin:8px 0; }
.seg button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:0; background:none; font-weight:700; padding:10px 4px; border-radius:12px; font-size:15px; color:var(--muted); }
.seg button.on { background:var(--surface); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.12); }
.seg svg.i { width:18px; height:18px; }
pre.msg { white-space:pre-wrap; background:var(--surface-2); border-radius:18px; padding:14px; font:inherit; font-size:14.5px; margin:12px 0; line-height:1.6; }
.mt { width:100%; border-collapse:collapse; font-size:15px; }
.mt th, .mt td { padding:10px 4px; border-bottom:1px solid var(--border); text-align:center; }
.mt tr:last-child td { border-bottom:0; }
.mt th { color:var(--muted); font-weight:700; font-size:12.5px; }
.mt td:first-child { text-align:right; font-weight:700; }
.mt td.neg { color:var(--ok); font-weight:800; } .mt td.pos { color:var(--bad); font-weight:800; }
table.tb { width:100%; border-collapse:collapse; font-size:15px; }
table.tb td, table.tb th { padding:10px 6px; border-bottom:1px solid var(--border); }
table.tb tr:last-child td { border-bottom:0; }
table.tb th { color:var(--muted); font-size:12.5px; text-align:right; }
table.tb .day { font-weight:800; width:72px; }
table.tb.c td, table.tb.c th { text-align:center; }
.light { border-radius:14px; padding:10px 12px; margin:6px 0; font-weight:600; font-size:15px; }
.light.g { background:var(--ok-soft); } .light.y { background:var(--warn-soft); } .light.r { background:var(--bad-soft); }
.acc { background:var(--surface); border:1px solid var(--border); border-radius:20px; margin:10px 0; overflow:hidden; }
.acc summary { list-style:none; display:flex; align-items:center; gap:12px; padding:14px; font-weight:700; font-size:16px; }
.acc summary::-webkit-details-marker { display:none; }
.acc summary .ico { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); color:var(--a1); flex:none; }
.acc summary .chev { margin-inline-start:auto; color:var(--muted); transition:transform .2s; }
.acc[open] summary .chev { transform:rotate(-90deg); }
.acc .in { padding:0 16px 16px; }
.acc ol { padding-right:20px; margin:4px 0; } .acc li { margin:4px 0; }
.exrow { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
.exrow:last-child { border-bottom:0; }
.exrow img { width:52px; height:52px; border-radius:14px; object-fit:cover; }

/* ---------- undo ---------- */

.nrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }

.switch { position:relative; width:46px; height:28px; flex:none; }

/* ---------- nav ---------- */
nav { position:fixed; left:14px; right:14px; bottom:calc(env(safe-area-inset-bottom) + 10px); z-index:5; display:flex; justify-content:center; }
nav .wrap { display:flex; width:100%; max-width:452px; background:var(--glass); backdrop-filter:blur(18px) saturate(1.6); -webkit-backdrop-filter:blur(18px) saturate(1.6); border:1px solid var(--border); border-radius:26px; padding:6px; box-shadow:0 12px 30px rgba(0,0,0,.25); }

/* ---------- overlays ---------- */
.modal { position:fixed; inset:0; background:rgba(5,6,10,.7); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:20; padding:28px; animation:fade .2s; }
.mbox { background:var(--surface); border:1px solid var(--border); border-radius:32px; padding:30px 22px 14px; text-align:center; width:100%; max-width:340px; animation:pop .45s cubic-bezier(.2,1.5,.4,1); }

.memo.lv { background:var(--grad); color:#fff; box-shadow:0 18px 40px -12px rgba(124,92,255,.8); }

@keyframes pop { from { transform:scale(.6) translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes fade { from { opacity:0; } }
.xp-pop { position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:50%; transform:translateX(-50%); background:var(--gold-grad); color:#241a00; font-weight:900; font-size:17px; padding:9px 20px; border-radius:999px; z-index:15; direction:ltr; animation:rise 1.5s ease forwards; box-shadow:0 10px 26px rgba(245,165,36,.45); display:flex; gap:6px; align-items:center; }

@keyframes rise { 0% { opacity:0; transform:translate(-50%,12px) scale(.9); } 15% { opacity:1; transform:translate(-50%,0) scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-16px); } }
.toast { position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 20px; border-radius:999px; font-weight:700; z-index:16; font-size:15px; }
